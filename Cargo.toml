[workspace]
members = [
    "crates/grader-core",
    "crates/grader-cli",
    "apps/desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Instructor Essentials Contributors"]
license = "MIT"
repository = "https://github.com/philsumabat/grader"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
imageproc = "0.25"
nalgebra = "0.33"
csv = "1.3"
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
