[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instructors-toolkit"
version = "1.0.0"
description = "Instructors' Toolkit — Browser OMR exam designer, automated grading pipeline, and psychometrics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",
    "pytesseract>=0.3.10",
    "pypdfium2>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
ui = [
    "gradio>=4.44.0",
]

[project.scripts]
instructors-toolkit = "omr.cli:main"
instructor-essentials = "omr.cli:main"
checker = "omr.cli:main"
grader = "omr.cli:main"
omr = "omr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omr*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
