[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grader"
version = "1.0.0"
description = "Optical Mark Recognition and document processing pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
grader = "omr.cli:main"
omr = "omr.cli:main"
